name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/demo/run.js
        # Smoke-tests the self-contained demo on every push/PR — as new
        # capability lands and swaps out a fixture in src/demo/run.ts, CI
        # catches breakage immediately instead of the demo silently rotting.
      # The embedded (PGlite) profile is exercised by the test suite above.
      # The hosted-Postgres profile gets its own job here once a real
      # instance is available in CI — shipping it untested would be worse
      # than not shipping it.
